<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
  :root{
    --paper:#F7F3EA;
    --paper-card:#FFFDF8;
    --ink:#221F1B;
    --ink-soft:#57534A;
    --ink-faint:#8C877C;
    --seal:#A6402F;
    --seal-dark:#7E2F22;
    --jade:#4B7A6C;
    --jade-light:#DCEAE4;
    --line:#DDD5C4;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(34,31,27,0.05) 1px, transparent 0);
    background-size:22px 22px;
    color:var(--ink);
    font-family:"PT Serif","Georgia",serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overflow-x:hidden;
  }
  .app{
    width:100%;
    max-width:460px;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    padding:18px 18px 22px;
  }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:14px;
  }
  header .title{
    font-size:26px;
    font-weight:700;
    letter-spacing:0.5px;
  }
  header .title span{
    color:var(--seal);
  }
  header .counter{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:13px;
    color:var(--ink-faint);
    white-space:nowrap;
  }

  .stats{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12.5px;
    color:var(--jade);
    font-weight:700;
    margin-bottom:12px;
  }

  .sound-row{
    display:flex;
    gap:10px;
    margin-top:18px;
  }
  .sound-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:1.5px solid var(--jade);
    background:var(--paper-card);
    font-size:19px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .sound-btn:active{
    transform:scale(0.92);
    background:var(--jade);
  }
  .sound-btn.hidden{
    display:none;
  }

  .tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding-bottom:6px;
    margin-bottom:16px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--paper-card);
    color:var(--ink-soft);
    cursor:pointer;
  }
  .tab.active{
    background:var(--ink);
    border-color:var(--ink);
    color:var(--paper);
  }

  .stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:380px;
    position:relative;
  }

  .card-wrap{
    width:100%;
    max-width:320px;
    aspect-ratio:3/4;
    perspective:1400px;
  }
  .card{
    position:relative;
    width:100%;
    height:100%;
    transform-style:preserve-3d;
    transition:transform 0.55s cubic-bezier(.4,.2,.2,1);
    cursor:pointer;
  }
  .card.flipped{
    transform:rotateY(180deg);
  }
  .card.shake{
    animation:shake 0.4s;
  }
  @keyframes shake{
    0%,100%{transform:translateX(0);}
    20%{transform:translateX(-10px);}
    40%{transform:translateX(9px);}
    60%{transform:translateX(-6px);}
    80%{transform:translateX(4px);}
  }
  .face{
    position:absolute;
    inset:0;
    backface-visibility:hidden;
    border-radius:22px;
    background:var(--paper-card);
    border:1.5px solid var(--ink);
    box-shadow:5px 5px 0 rgba(34,31,27,0.12);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }
  .face .corner{
    position:absolute;
    width:34px;
    height:34px;
    top:14px;
    right:14px;
    border-radius:8px;
    background:var(--seal);
    color:var(--paper);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:16px;
    font-weight:700;
    transform:rotate(6deg);
  }
  .face.front .emoji{
    font-size:88px;
    line-height:1;
    margin-bottom:18px;
    filter:drop-shadow(2px 3px 0 rgba(34,31,27,0.08));
  }
  .face.front .hanzi{
    font-size:64px;
    font-weight:700;
    letter-spacing:2px;
    line-height:1.1;
  }
  .face.front .hint{
    margin-top:22px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12.5px;
    color:var(--ink-faint);
    letter-spacing:0.3px;
  }
  .face.back{
    transform:rotateY(180deg);
    background:var(--jade-light);
    border-color:var(--jade);
  }
  .face.back .pinyin{
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:18px;
    color:var(--jade);
    font-weight:700;
    margin-bottom:10px;
  }
  .face.back .ru{
    font-size:34px;
    font-weight:700;
    color:var(--ink);
    line-height:1.15;
  }
  .face.back .hanzi-small{
    margin-top:16px;
    font-size:26px;
    color:var(--ink-soft);
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:26px;
  }
  .btn{
    font-family:"Helvetica Neue",Arial,sans-serif;
    border:1.5px solid var(--ink);
    background:var(--paper-card);
    color:var(--ink);
    border-radius:14px;
    padding:12px 16px;
    font-size:15px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    user-select:none;
  }
  .btn:active{
    transform:scale(0.95);
  }
  .btn.round{
    width:52px;
    height:52px;
    padding:0;
    border-radius:50%;
    font-size:20px;
  }
  .btn.primary{
    background:var(--ink);
    color:var(--paper);
    flex:1;
    max-width:150px;
  }
  .btn.star{
    border-color:var(--seal);
  }
  .btn.star.active{
    background:var(--seal);
    color:var(--paper);
  }

  .progress{
    margin-top:20px;
    width:100%;
    max-width:320px;
    height:5px;
    border-radius:4px;
    background:var(--line);
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    background:var(--seal);
    border-radius:4px;
    transition:width 0.3s ease;
  }

  .praise-box{
    margin-top:22px;
    padding:14px;
    border-radius:14px;
    border:1.5px dashed var(--line);
    background:rgba(255,253,248,0.6);
  }
  .praise-box label{
    display:block;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;
    color:var(--ink-faint);
    margin-bottom:8px;
  }
  .praise-row{
    display:flex;
    gap:8px;
  }
  .praise-row input{
    flex:1;
    min-width:0;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:14px;
    padding:10px 12px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:var(--paper-card);
    color:var(--ink);
  }
  .praise-row input:focus{
    outline:none;
    border-color:var(--jade);
  }

  footer{
    text-align:center;
    margin-top:18px;
    font-family:"Helvetica Neue",Arial,sans-serif;
    font-size:12px;
    color:var(--ink-faint);
  }

  .empty{
    font-family:"Helvetica Neue",Arial,sans-serif;
    color:var(--ink-faint);
    text-align:center;
    padding:40px 20px;
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="title">汉字 <span>·</span> Карточки</div>
    <div class="counter" id="counter">1 / 1</div>
  </header>
  <div class="stats" id="stats">Выучено 0 из 0</div>

  <div class="tabs" id="tabs"></div>

  <div class="stage" id="stage">
    <div class="card-wrap">
      <div class="card" id="card">
        <div class="face front">
          <div class="corner">汉</div>
          <div class="emoji" id="emoji">🐱</div>
          <div class="hanzi" id="hanzi">猫</div>
          <div class="hint">нажми на карточку</div>
        </div>
        <div class="face back">
          <div class="pinyin" id="pinyin">māo</div>
          <div class="ru" id="ru">кошка</div>
          <div class="hanzi-small" id="hanziSmall">猫</div>
          <div class="sound-row">
            <button class="sound-btn" id="speakBtn" aria-label="Произнести">🔊</button>
            <button class="sound-btn" id="animalSoundBtn" aria-label="Звук животного">🐾</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

  <div class="controls">
    <button class="btn round" id="prevBtn" aria-label="Назад">◀</button>
    <button class="btn primary" id="knowBtn">Знаю ✓</button>
    <button class="btn round" id="nextBtn" aria-label="Вперёд">▶</button>
  </div>
  <div class="controls" style="margin-top:10px;">
    <button class="btn" id="shuffleBtn">🔀 Перемешать</button>
    <button class="btn" id="resetBtn">↺ Сбросить прогресс</button>
  </div>

  <div class="praise-box">
    <label for="praiseInput">Своя фраза-похвала за каждые 10 слов (необязательно). Можно вставить {count} — число слов, и {animal} — случайное животное</label>
    <div class="praise-row">
      <input type="text" id="praiseInput" maxlength="150" placeholder="Например: Ты выучил уже {count} слов, ты хитёр, как {animal}!">
      <button class="btn" id="praiseSaveBtn">Сохранить</button>
    </div>
    <button class="btn" id="praiseTestBtn" style="margin-top:8px;">▶️ Проверить звучание</button>
  </div>

  <footer>Проведи пальцем влево/вправо или нажимай стрелки. При перевороте карточка произносит слово вслух.</footer>
</div>

  ]}
];
function getPraiseStage(count){
  return PRAISE_STAGES.find(s => count >= s.min);
}

function speakSegments(segments){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  segments.forEach(seg => {
    const utter = new SpeechSynthesisUtterance(seg.t);
    if(seg.lang === "zh"){
      const zhVoice = voicesCache.find(v => v.lang && v.lang.toLowerCase().startsWith("zh"));
      if(zhVoice) utter.voice = zhVoice;
      utter.lang = zhVoice ? zhVoice.lang : "zh-CN";
      utter.rate = 0.85;
      utter.pitch = 1.15;
    }else{
      const ruVoice = voicesCache.find(v => v.lang && v.lang.toLowerCase().startsWith("ru"));
      if(ruVoice) utter.voice = ruVoice;
      utter.lang = ruVoice ? ruVoice.lang : "ru-RU";
      utter.rate = 1;
      utter.pitch = 1.1;
    }
    window.speechSynthesis.speak(utter);
  });
}

function speakPraise(count){
  if(!window.speechSynthesis) return;
  const n = count || 10;
  const custom = customPraise.trim();
  if(custom){
    const text = custom.replace(/\{count\}/gi, n).replace(/\{animal\}/gi, randomPraiseAnimal());
    speakSegments([{ t: text, lang: "ru" }]);
  }else{
    speakSegments(getPraiseStage(n).segments);
  }
}

/* ---------- Синтез речи (произношение иероглифа) ---------- */
let voicesCache = [];
function loadVoices(){
  voicesCache = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
}
if(window.speechSynthesis){
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}
function pickChineseVoice(){
  const zh = voicesCache.filter(v => v.lang && v.lang.toLowerCase().startsWith("zh"));
  if(zh.length === 0) return null;
  const femaleHints = ["female","ting","xiaoxiao","yaoyao","huihui","mei","yating","女"];
  const female = zh.find(v => femaleHints.some(hint => v.name.toLowerCase().includes(hint)));
  return female || zh[0];
}
function speak(text){
  if(!window.speechSynthesis || !text) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const voice = pickChineseVoice();
  if(voice) utter.voice = voice;
  utter.lang = voice ? voice.lang : "zh-CN";
  utter.rate = 0.85;
  utter.pitch = 1.15;
  window.speechSynthesis.speak(utter);
}

/* ---------- Синтезированные звуки животных (без аудиофайлов) ---------- */
let audioCtx = null;
function getCtx(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if(audioCtx.state === "suspended") audioCtx.resume();
  return audioCtx;
}
function tone(ctx, freqStart, freqEnd, duration, startTime, waveType, gainPeak){
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = waveType || "sine";
  osc.frequency.setValueAtTime(freqStart, startTime);
  osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd, 1), startTime + duration);
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(gainPeak || 0.2, startTime + duration * 0.15);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  osc.connect(gain).connect(ctx.destination);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
}
function noiseBurst(ctx, duration, startTime, filterFreq, gainPeak){
  const bufferSize = Math.floor(ctx.sampleRate * duration);
  const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = ctx.createBufferSource();
  noise.buffer = buffer;
  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = filterFreq || 1000;
  const gain = ctx.createGain();
  gain.gain.setValueAtTime(0.0001, startTime);
  gain.gain.exponentialRampToValueAtTime(gainPeak || 0.25, startTime + duration * 0.1);
  gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
  noise.connect(filter).connect(gain).connect(ctx.destination);
  noise.start(startTime);
  noise.stop(startTime + duration + 0.02);
}
function playAnimalSound(type){
  if(!type) return;
  const ctx = getCtx();
  const t0 = ctx.currentTime + 0.02;
  switch(type){
    case "meow":
      tone(ctx, 600, 900, 0.18, t0, "sawtooth", 0.2);
      tone(ctx, 900, 500, 0.22, t0 + 0.16, "sawtooth", 0.18);
      break;
    case "bark":
      noiseBurst(ctx, 0.1, t0, 800, 0.3);
      tone(ctx, 300, 150, 0.12, t0, "square", 0.2);
      noiseBurst(ctx, 0.1, t0 + 0.22, 800, 0.28);
      tone(ctx, 300, 150, 0.12, t0 + 0.22, "square", 0.18);
      break;
    case "chirp":
      tone(ctx, 2200, 3200, 0.08, t0, "sine", 0.15);
      tone(ctx, 2400, 3400, 0.08, t0 + 0.12, "sine", 0.15);
      tone(ctx, 2000, 3000, 0.08, t0 + 0.24, "sine", 0.13);
      break;
    case "neigh":
      tone(ctx, 300, 700, 0.35, t0, "sawtooth", 0.22);
      tone(ctx, 700, 300, 0.3, t0 + 0.32, "sawtooth", 0.18);
      break;
    case "bleat":
      tone(ctx, 400, 550, 0.15, t0, "sawtooth", 0.2);
      tone(ctx, 550, 380, 0.15, t0 + 0.14, "sawtooth", 0.18);
      tone(ctx, 500, 350, 0.15, t0 + 0.28, "sawtooth", 0.15);
      break;
    case "moo":
      tone(ctx, 150, 220, 0.6, t0, "sawtooth", 0.25);
      break;
    case "oink":
      tone(ctx, 250, 180, 0.12, t0, "square", 0.22);
      tone(ctx, 260, 170, 0.12, t0 + 0.15, "square", 0.2);
      break;
    case "roar":
      noiseBurst(ctx, 0.5, t0, 300, 0.25);
      tone(ctx, 120, 90, 0.5, t0, "sawtooth", 0.22);
      break;
    case "growl":
      tone(ctx, 100, 80, 0.4, t0, "sawtooth", 0.2);
      noiseBurst(ctx, 0.4, t0, 200, 0.15);
      break;
    case "hiss":
      noiseBurst(ctx, 0.5, t0, 4000, 0.15);
      break;
    case "monkey":
      tone(ctx, 700, 1000, 0.1, t0, "sawtooth", 0.18);
      tone(ctx, 700, 1000, 0.1, t0 + 0.14, "sawtooth", 0.18);
      tone(ctx, 900, 1300, 0.1, t0 + 0.28, "sawtooth", 0.16);
      break;
    case "trumpet":
      tone(ctx, 300, 900, 0.5, t0, "sawtooth", 0.22);
      break;
    case "buzz":
      tone(ctx, 220, 240, 0.6, t0, "sawtooth", 0.12);
      break;
    case "croak":
      tone(ctx, 200, 120, 0.18, t0, "square", 0.2);
      tone(ctx, 200, 120, 0.18, t0 + 0.2, "square", 0.18);
      break;
    case "squeak":
      tone(ctx, 2500, 3500, 0.07, t0, "sine", 0.15);
      tone(ctx, 2800, 3800, 0.07, t0 + 0.09, "sine", 0.13);
      break;
    case "cluck":
      tone(ctx, 500, 350, 0.09, t0, "square", 0.18);
      tone(ctx, 500, 350, 0.09, t0 + 0.12, "square", 0.16);
      break;
    case "quack":
      tone(ctx, 400, 250, 0.13, t0, "sawtooth", 0.2);
      tone(ctx, 400, 250, 0.13, t0 + 0.16, "sawtooth", 0.18);
      break;
    default:
      tone(ctx, 500, 700, 0.2, t0, "sine", 0.15);
  }
}

function saveKnown(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify([...known]));
}

function cardKey(card){
  return card.h + "|" + card.c;
}

function buildTabs(){
  el.tabs.innerHTML = "";
  CATEGORIES.forEach(cat => {
    const btn = document.createElement("div");
    btn.className = "tab" + (cat.id === currentCategory ? " active" : "");
    btn.textContent = cat.label;
    btn.onclick = () => {
      currentCategory = cat.id;
      buildTabs();
      buildDeck();
    };
    el.tabs.appendChild(btn);
  });
}

function buildDeck(){
  deck = currentCategory === "all" ? DATA.slice() : DATA.filter(c => c.c === currentCategory);
  order = deck.map((_, i) => i);
  pos = 0;
  flipped = false;
  render();
}

function shuffleOrder(){
  for(let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  pos = 0;
  flipped = false;
  render();
}

function currentCard(){
  if(deck.length === 0) return null;
  return deck[order[pos]];
}

function render(){
  if(deck.length === 0){
    el.stage.innerHTML = '<div class="empty">В этой категории пока нет карточек.</div>';
    el.counter.textContent = "0 / 0";
    el.progressBar.style.width = "0%";
    return;
  }
  const c = currentCard();
  el.card.classList.remove("flipped");
  flipped = false;
  el.emoji.textContent = c.e;
  el.hanzi.textContent = c.h;
  el.pinyin.textContent = c.p;
  el.ru.textContent = c.r;
  el.hanziSmall.textContent = c.h;
  el.counter.textContent = (pos + 1) + " / " + deck.length;
  el.progressBar.style.width = ((pos + 1) / deck.length * 100) + "%";
  el.knowBtn.classList.toggle("star", false);
  el.knowBtn.classList.toggle("active", known.has(cardKey(c)));
  el.knowBtn.textContent = known.has(cardKey(c)) ? "Выучено ✓" : "Знаю ✓";
  el.animalSoundBtn.classList.toggle("hidden", !c.snd);
  el.stats.textContent = "Выучено " + known.size + " из " + DATA.length;
}

function flip(){
  if(deck.length === 0) return;
  flipped = !flipped;
  el.card.classList.toggle("flipped", flipped);
  if(flipped){
    const c = currentCard();
    if(c){
      if(c.snd){
        playAnimalSound(c.snd);
        setTimeout(() => speak(c.h), 450);
      }else{
        speak(c.h);
      }
    }
  }else if(window.speechSynthesis){
    window.speechSynthesis.cancel();
  }
}

function next(){
  if(deck.length === 0) return;
  pos = (pos + 1) % deck.length;
  render();
}

function prev(){
  if(deck.length === 0) return;
  pos = (pos - 1 + deck.length) % deck.length;
  render();
}

function toggleKnown(){
  const c = currentCard();
  if(!c) return;
  const key = cardKey(c);
  const before = known.size;
  if(known.has(key)) known.delete(key); else known.add(key);
  saveKnown();
  render();
  if(known.size > before && known.size % 10 === 0){
    setTimeout(() => speakPraise(known.size), 300);
  }
}

el.card.addEventListener("click", flip);
el.speakBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  const c = currentCard();
  if(c) speak(c.h);
});
el.animalSoundBtn.addEventListener("click", (e) => {
  e.stopPropagation();
  const c = currentCard();
  if(c && c.snd) playAnimalSound(c.snd);
});
el.knowBtn.addEventListener("click", toggleKnown);
el.nextBtn.addEventListener("click", next);
el.prevBtn.addEventListener("click", prev);
el.shuffleBtn.addEventListener("click", shuffleOrder);
el.resetBtn.addEventListener("click", () => {
  known = new Set();
  saveKnown();
  render();
});

document.addEventListener("keydown", (e) => {
  if(e.key === "ArrowRight") next();
  if(e.key === "ArrowLeft") prev();
  if(e.key === " "){ e.preventDefault(); flip(); }
});

let touchStartX = null;
document.addEventListener("touchstart", (e) => {
  touchStartX = e.touches[0].clientX;
}, {passive:true});
document.addEventListener("touchend", (e) => {
  if(touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if(Math.abs(dx) > 60){
    if(dx < 0) next(); else prev();
  }
  touchStartX = null;
}, {passive:true});

buildTabs();
buildDeck();

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
